[metadata]
name = watchbill
version = attr: watchbill.__version__
description = A harness for AI agents in embedded software development, deployed at a fixed revision onto an existing project
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/fa1k3n/watchbill

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
# The standard library and one more library: the YAML library the distribution packages (docs/revision.md, point 6).
# 5.4 is what Enterprise Linux 9 has. The RPM turns this line into a requirement on python3-pyyaml.
install_requires =
    PyYAML>=5.4

[options.package_data]
watchbill =
    revision/*.yml

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    wb = watchbill.cli:run
    watchbill = watchbill.cli:run
