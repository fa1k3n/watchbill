# The model table: one exact model ID and one effort for each role that has a prompt, but the breakdown.
# Never "latest", and never a name without a version. Read by src/rules.rs.
# Where an issue names another model or effort, the table wins: an issue may ask for more, never for less.
# These rows are for a vendor's runner. The breakdown has none here: its runner, model and effort are
# cleared in the organisation's file, and `wb` refuses a runner that is not (docs/revision.md, points 5 and 11).
models:
  tester:
    model: claude-sonnet-5-5
    effort: medium
  build:
    model: claude-sonnet-5-5
    effort: medium
  review:
    model: claude-opus-5-5
    effort: high
  fix:
    model: claude-sonnet-5-5
    effort: medium

# The models of local runners: a place of their own, empty until the first local runner exists
# (docs/revision.md, point 11).
local_models: {}
