[metadata]
name = watchbill
version = attr: watchbill.__version__
description = A harness for AI agents in embedded software development, deployed at a fixed revision onto an existing project
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/fa1k3n/watchbill

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
# Only the standard library, so a distribution's own Python runs it.
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    wb = watchbill.cli:run
    watchbill = watchbill.cli:run
